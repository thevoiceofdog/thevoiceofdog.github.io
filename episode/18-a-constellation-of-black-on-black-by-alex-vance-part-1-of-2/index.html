                  <meta property="og:description" content="[18+] A solitary criminal without remorse or a reason to live meets a rebellious young noble who yearns for a wilder life. Their passion becomes a dangerous game, but whose life is it that hangs in the balance?Today’s story is the first of two parts of “A Constellation of Black on Black” by Alex Vance, first published in FurNation Magazine in 2008, set in the world of Kyell Gold’s novel “Volle”. Alex Vance was the founder of Bad Dog Books, editor of the first three volumes of the FANG anthology and won an Ursa Major Award for Heathen City in 2008. His new novel “Game of Life”, co-written with your humble host, was recently published by Doppelfoxx Publishing, also as an audiobook.Read for you by Khaki, your faithful fireside companion.">
