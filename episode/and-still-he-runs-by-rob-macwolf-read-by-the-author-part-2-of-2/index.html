                  <meta property="og:description" content="But the domestication of the dog is hardly history’s last turning point.Today’s story is the first of two parts of “And Still He Runs” by Rob MacWolf, which you can find with other wolf stories in Spirit of the Wolf, from Wolfsinger Publications, proceeds of which go to support a wolf sanctuary. You can get his most recent book, “Game of Life,” from Doppelfoxx Publications, and find more of his stories from Bewere Books and on SubcribeStar.Last time, we brought you an expansion of a fable you may recognize, of a dog who wishes his brother would come in from the cold, and a wolf who holds that it is better to starve in freedom than to live in chains. The ages saw them become only the more convinced, but what is there that cannot change, given ages enough?Read by the Author.">
