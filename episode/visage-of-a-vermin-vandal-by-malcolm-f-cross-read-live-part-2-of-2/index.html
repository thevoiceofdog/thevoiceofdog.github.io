                  <meta property="og:description" content="Some people think all a rat could ever be is a janitor, but, as Rick discovers, he could be something else, too – an inspired artist.Today’s story was recorded in front of a live audience at Furlandia 2026.Today’s Story is the second and final part of “Visage of a Vermin Vandal” by Malcolm F. Cross, who has been writing stories in the same setting as this story for more than a decade, including two novels – Dog Country, and Mouse Cage. You can catch up with them at their website, SinIsBeautiful.com, or on Bluesky.Last time, Rick Larue, genetically engineered rat, was denied a promotion because his boss was convinced a rat’s happy place was cleaning bioreactor sewage. Rick was convinced too, up until he encountered a beautiful mural on the side of a Hindu Mandir, depicting the goddess Karni Mata, and the rats she holds sacred...">
