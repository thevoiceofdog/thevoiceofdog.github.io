                  <meta property="og:title" content="The Voice of Dog: “Would?” by Packwolf Lupestripe (part 2 of 2)">
                  <meta property="og:description" content="The day of the Prop 9 vote draws near, yet Greystoke is torn between campaigning and longing for Aspatria. Can love thrive, both for them and queer people across Oregon?Today’s story is the second of two parts of “Would?” by Packwolf Lupestripe. This story featured in the ‘Wild Hearts’ anthology published by Armoured Fox Press in 2025. You can find more of her stories on her website https://lupestripe.com/Last time, Greystoke’s feelings for her former flame, Aspatria Caldbeck, reignited when she went to one of her gigs on campus. After the show, they hooked up in the college canteen where they reminisced about the past and looked to the future.This concludes, for this year, our Summer Reading Program schedule. Starting next week, we return to our ordinary time schedule, during which you can expect a new episode every Monday.">
